# Builds the game for iPad and uploads it to TestFlight. See instructions.md for the secrets it needs
name: iOS TestFlight build

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (three numbers)
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  testflight:
    # Keep the runner and Xcode pinned: apps built with the iOS 27 SDK need the UIScene lifecycle or
    # they fail to launch, and LÖVE 11.5 predates it
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/overrides.xcconfig
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # love_builder.py needs Python 3.12+
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package game and icons
        run: |
          pip install toml pillow
          python love_builder.py
          python ios/make_icons.py
          unzip -l build/love/CloudlessSky.love | grep -q cloudless_sky/extern/suit/init.lua

      # love-actions-ios runs an unpinned `npm i plist xcode ...` then require()s them, but plist 5 is
      # ESM only. npm keeps these versions as they're already in package.json by then
      - name: Pin npm packages for love-actions-ios
        run: npm i --save-exact plist@3.1.1 xcode@4.0.0

      # pinned to the commit of v1.1.3, as this third party action receives the signing secrets
      - name: Build and upload to TestFlight
        uses: love-actions/love-actions-ios@5828881a1f03277e78cb856376ea533bb9689dbc
        with:
          app-name: Cloudless Sky
          bundle-id: me.lenord.cloudlesssky
          product-name: CloudlessSky
          version-string: ${{ inputs.version }}
          love-ref: "11.5"
          love-patch: ./ios/landscape.patch
          love-package: ./build/love/CloudlessSky.love
          icon-path: ./ios/icon
          output-folder: ./ios-build
          apple-development-base64: ${{ secrets.APPLE_DEV_CERT_BASE64 }}
          apple-development-password: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          api-key: ${{ secrets.ASC_API_KEY }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-id: ${{ secrets.ASC_APP_ID }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-build-${{ github.run_number }}
          path: ios-build
          if-no-files-found: ignore
          retention-days: 14
